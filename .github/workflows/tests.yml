name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ', lowest dependencies' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        # The oldest version of everything composer.json allows, on the oldest
        # PHP. The other jobs only ever see the newest, which is how Carbon
        # 3.8.4 counting every interval as zero days went unseen until 1.2.1.
        include:
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, sqlite3
          coverage: none

      # `update`, not `install`: the committed lock file was resolved on the
      # newest PHP, where Laravel 13 is chosen. On 8.2 Laravel 13 cannot be
      # installed, so each PHP version resolves its own set.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      # This addon targets Statamic 6. Anything else resolving is a bug in the
      # constraints, and building against it would be building the wrong thing.
      - name: Confirm Statamic 6 resolved
        run: composer show statamic/cms | grep -E '^versions\s*:\s*\* v6\.'

      - name: Tests
        run: vendor/bin/pest --ci

  lint:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  assets:
    name: Control panel assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Vite plugin comes from vendor/statamic/cms, so Composer runs first.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # The build is committed, because an addon ships its assets rather than
      # asking every site to run a build. A change to resources/js that was
      # not rebuilt and committed would ship the old bundle.
      - name: Committed build is current
        run: git diff --exit-code -- resources/dist
